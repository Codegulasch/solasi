<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOLASI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='26' fill='%23f59e0b'/%3E%3Ccircle cx='32' cy='32' r='12' fill='%23fff7e0'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#fbf7f0;--card:#ffffff;--fg:#2b2a28;--muted:#7d766b;--line:#efe7da;--chip:#f6efe3;
  --accent:#f59e0b;--accent-d:#d97706;--accent-soft:#fff3d6;
  --ok:#1f9d63;--warn:#d97706;--bad:#e5484d;--test:#8b5cf6;--sun:#f59e0b;--bat:#14b8a6;--grid:#6366f1;--home:#64748b;
  --shadow:0 1px 2px rgba(60,40,10,.05),0 6px 18px rgba(60,40,10,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#15171b;--card:#1f2228;--fg:#f2eee7;--muted:#a59e92;--line:#2c3038;--chip:#292d35;
  --accent:#fbbf24;--accent-d:#f59e0b;--accent-soft:#3a2f14;
  --ok:#4ade99;--warn:#fbbf24;--bad:#ff7b7f;--test:#b79cff;--sun:#fbbf24;--bat:#2dd4bf;--grid:#8b8dff;--home:#94a3b8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px;flex:none}
.brand b{font-size:21px;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12px;margin-top:-3px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;background:var(--chip);color:var(--muted)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--bad)}
.pill.ok i{background:var(--ok)}.pill.ok{color:var(--ok)}
.pill.test{color:var(--test)}.pill.test i{background:var(--test)}
.pill.live{color:var(--ok)}.pill.live i{background:var(--ok)}
.pill.off{color:var(--warn)}.pill.off i{background:var(--warn)}
.pill.stop{color:var(--bad)}.pill.stop i{background:var(--bad)}
button.kill{background:var(--bad);color:#fff;border:0;border-radius:999px;padding:6px 15px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;box-shadow:var(--shadow)}
button.kill:hover{filter:brightness(1.1)}
button.kill.resume{background:var(--ok)}
.toggles{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.tg{display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:999px;padding:6px 13px 6px 10px;cursor:pointer;user-select:none;font-size:13px;font-weight:500;transition:background .15s}
.tg:hover{background:color-mix(in srgb,var(--chip) 70%,var(--accent) 12%)}
.tg input{display:none}
.tg i{width:32px;height:18px;border-radius:9px;background:#b9b2a5;position:relative;transition:.18s;flex:none}
.tg i:after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.tg input:checked+i{background:var(--ok)}
.tg input:checked+i:after{left:16px}
.tg.test input:checked+i{background:var(--test)}
.page{display:none}.page.act{display:block}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow)}
.card h3{margin:0 0 6px;font-size:12.5px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.06em}
.big{font-size:34px;font-weight:750;line-height:1.1;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:13.5px}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.tag{display:inline-block;background:var(--chip);border-radius:8px;padding:2px 9px;font-size:12px;margin:3px 5px 0 0;font-weight:500}
.tag.ok{color:var(--ok)}.tag.warn{color:var(--warn)}.tag.bad{color:var(--bad)}.tag.test{color:var(--test)}
.hero{background:linear-gradient(135deg,var(--accent-soft),var(--card) 70%);border-radius:20px;padding:18px 20px;margin-bottom:14px;border:1px solid var(--line);box-shadow:var(--shadow)}
.hero .headline{font-size:20px;font-weight:700;letter-spacing:-.01em}
.hero .sub{margin-top:2px}
.banner{border-radius:14px;padding:11px 15px;margin-bottom:12px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner.test{background:color-mix(in srgb,var(--test) 13%,transparent);color:var(--test)}
.banner.off{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.banner.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.flow{padding:6px 8px 0}
.flow svg{width:100%;height:auto;display:block;max-height:330px}
.flow text{font-family:inherit}
.node-label{fill:var(--muted);font-size:13px;font-weight:600}
.node-val{fill:var(--fg);font-size:17px;font-weight:750}
.node-sub{fill:var(--muted);font-size:11.5px}
.edge-val{fill:var(--muted);font-size:12px;font-weight:650}
.line{stroke:var(--line);stroke-width:4;stroke-linecap:round;fill:none}
.line.active{stroke-width:4;stroke-dasharray:3 11;animation:dash 1s linear infinite}
.line.rev{animation-direction:reverse}
@keyframes dash{to{stroke-dashoffset:-28}}
@media (prefers-reduced-motion:reduce){.line.active{animation:none}}
.bat{display:flex;align-items:center;gap:14px;margin:4px 0 10px}
.bat svg{width:62px;height:34px;flex:none}
.steps{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin:20px 0;text-align:left}
.step{background:var(--chip);border-radius:14px;padding:13px 15px}
.step b{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;align-items:center;justify-content:center;margin-bottom:6px;font-size:14px}
details.fsec{border:1px solid var(--line);border-radius:18px;background:var(--card);margin:0 0 14px;box-shadow:var(--shadow)}
details.fsec>summary{cursor:pointer;list-style:none;padding:13px 18px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
details.fsec>summary::-webkit-details-marker{display:none}
details.fsec>summary::before{content:"▸";color:var(--accent);transition:transform .15s}
details.fsec[open]>summary::before{transform:rotate(90deg)}
details.fsec>summary .sub{font-weight:400;font-size:12.5px;margin-left:auto}
details.fsec>.fbody{padding:0 18px 8px;border-top:1px solid var(--line)}
.drvdesc{background:var(--accent-soft);border-radius:12px;padding:9px 12px;font-size:13px;margin:8px 0 2px}
.advnote{text-align:center;color:var(--muted);font-size:13px;margin:4px 0 16px}
fieldset{border:1px solid var(--line);border-radius:18px;background:var(--card);margin:0 0 14px;padding:10px 18px 8px;box-shadow:var(--shadow)}
legend{padding:0 10px;font-weight:700;font-size:15px}
.f{display:grid;grid-template-columns:minmax(180px,1.1fr) minmax(160px,1fr);gap:3px 16px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.f:last-child{border:0}
.f label{font-size:14px;font-weight:500}
.f .hint{grid-column:1/-1;color:var(--muted);font-size:12.5px;margin-top:-1px}
@media(max-width:620px){.f{grid-template-columns:1fr}.toggles{margin-left:0}}
input[type=text],input[type=number],select{width:100%;padding:8px 11px;border-radius:11px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.savebar{position:sticky;bottom:12px;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;padding:10px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:6px;box-shadow:var(--shadow)}
button.primary{background:var(--accent);color:#2b1c00;border:0;border-radius:12px;padding:10px 22px;font:inherit;font-weight:700;cursor:pointer;transition:transform .1s,background .15s}
button.primary:hover{background:var(--accent-d);color:#fff}
button.primary:active{transform:scale(.98)}
button.primary:disabled{opacity:.5}
.log{font:13px/1.55 ui-monospace,"SF Mono",Consolas,monospace}
:root{--sf-tile:var(--chip);--sf-card:var(--card);--sf-fg:var(--fg);--sf-muted:var(--muted);--sf-line:var(--line);--sf-sun:var(--sun);--sf-bat:var(--bat);--sf-grid:var(--grid);--sf-home:var(--home);--sf-ok:var(--ok);--sf-warn:var(--warn);--sf-bad:var(--bad)}
.trendbox svg{display:block;width:100%;height:auto}
.trendbox .empty{color:var(--muted);font-size:14px;padding:6px 0}
.mini{font:14px/1.45 var(--font,inherit)}
.mini div{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:2px 12px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line)}
.mini div:first-child{border-top:0;padding-top:2px}
.mini .t{color:var(--muted);font-size:13px;flex:none}
.mini i{width:8px;height:8px;border-radius:50%;background:var(--muted);align-self:center}
.mini .test i{background:var(--test)}.mini .act i{background:var(--ok)}.mini .error i{background:var(--bad)}
.mini .m{min-width:0;overflow-wrap:anywhere}
.udet{margin-top:6px;grid-column:1/4}
.udet summary{cursor:pointer;color:var(--muted);font-size:12.5px;font-weight:600}
.udet dl{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:8px 0 0;font-size:12.5px}
.udet dt{color:var(--muted)}.udet dd{margin:0;overflow-wrap:anywhere}
.log div{padding:5px 0;border-bottom:1px solid var(--line);display:flex;gap:12px}
.log .t{color:var(--muted);flex:none}
.log .error{color:var(--bad)}.log .test{color:var(--test)}.log .act{color:var(--ok)}
.msg{font-size:13px;color:var(--muted)}
details.slot{margin-bottom:14px}
details.slot>summary{cursor:pointer;font-weight:700;padding:10px 16px;background:var(--card);border:1px solid var(--line);border-radius:14px;list-style:none;box-shadow:var(--shadow)}
details.slot>summary::before{content:"▸";display:inline-block;margin-right:8px;transition:transform .15s;color:var(--accent)}
details.slot[open]>summary::before{transform:rotate(90deg)}
details.slot[open]>summary{margin-bottom:12px}
.chart{width:100%;height:auto;display:block}
.axis{fill:var(--muted);font-size:11px;font-family:inherit}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin-bottom:6px;font-size:12.5px}
.legend .lg{display:inline-flex;align-items:center;gap:6px}
.legend .lg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.legend .sub{margin-left:auto}
#toast{position:fixed;left:50%;bottom:76px;transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:10px 20px;border-radius:999px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:20}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Seitenleiste, Kopfzeile, Handy-Leiste ---------- */
html,body{min-height:100%}
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:30}
.side .brand{padding:16px 18px;border-bottom:1px solid var(--line)}
.nav{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:2px}
.nav .sec{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);opacity:.8;padding:14px 12px 4px}
.nav .sec:first-child{padding-top:4px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--muted);font:inherit;font-weight:500;text-align:left}
.nav button svg,.tabbar button svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover{background:var(--chip);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--accent);color:#2b1c00;font-weight:650}
.nav .badge{margin-left:auto;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--chip);color:var(--muted)}
.nav .badge.warn{background:var(--accent-soft);color:var(--warn)}
.nav .sep{height:1px;background:var(--line);margin:8px 6px}
.side-foot{border-top:1px solid var(--line);padding:12px 16px;display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--muted)}
.content{min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
.bar h1{margin:0;font-size:19px;letter-spacing:-.01em;margin-right:auto}
main{padding:20px 24px 40px;max-width:1180px;width:100%}
main.hasset{display:grid;grid-template-columns:190px minmax(0,1fr);gap:0 18px;align-items:start}
main.hasset>*{grid-column:2}
main.hasset>#subnav{grid-column:1;grid-row:1/span 30;position:sticky;top:72px}
.subnav{display:flex;flex-direction:column;gap:2px}
.subnav:empty{display:none}
.subnav button{border:0;background:none;text-align:left;padding:9px 12px;border-radius:10px;color:var(--muted);font:inherit;font-weight:500;cursor:pointer}
.subnav button:hover{background:var(--chip);color:var(--fg)}
.subnav button.act{background:var(--card);color:var(--fg);font-weight:650;box-shadow:var(--shadow)}
#pagetools{display:none;flex-wrap:wrap;gap:8px;margin-bottom:14px}
#pagetools.on{display:flex}
.tabbar{display:none}
.scrim{display:none}
body.first .side,body.first .tabbar,body.first .bar .tg,body.first .bar .kill,body.first #pagetools{display:none!important}
body.first .shell{grid-template-columns:minmax(0,1fr)}
body.first main{margin:0 auto}
/* ---------- Übersicht ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.kpi span{font-size:12px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kpi b{font-size:30px;line-height:1.1;letter-spacing:-.02em}
.kpi b em{font-size:15px;font-style:normal;color:var(--muted);font-weight:600;margin-left:3px}
.kpi small{color:var(--muted);font-size:12.5px}
.kpi.k-sun b{color:var(--sun)}.kpi.k-bat b{color:var(--bat)}.kpi.k-grid b{color:var(--grid)}.kpi.k-home b{color:var(--home)}
#p-status{overflow-anchor:none}
.ordrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}.ordrow button{padding:2px 10px;margin-left:4px}.ordrow label{display:flex;gap:8px;align-items:center}
.cols+[data-blk=kpis]{margin-top:14px}
.cols.one{grid-template-columns:minmax(0,1fr)}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.card h2{margin:0 0 10px;font-size:12.5px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.card h2 a{margin-left:auto;text-transform:none;letter-spacing:0;font-size:13px;color:var(--accent-d);text-decoration:none;font-weight:600;cursor:pointer}
.urow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.urow:last-of-type{border:0;padding-bottom:0}
.urow .bat{margin:0;grid-row:span 2}
.urow .bat svg{width:46px;height:26px}
.urow b{font-size:15px}
.urow .w{font-weight:700}
.urow .sub{grid-column:2/4}
.urow .pills2{grid-column:2/4;margin-top:2px}
.cons{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.cons:last-child{border:0}
.cons .sub{margin-left:auto;text-align:right}
#minilog{max-height:230px;overflow:auto;font-size:12.5px}
.banner button.primary{padding:4px 14px}
/* ---------- Einstellungen: Zeilen und Karten ---------- */
details.fsec{border-radius:18px}
details.fsec>summary{padding:14px 18px}
.f{padding:12px 0}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:8px;padding:5px 12px;font:inherit;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:var(--shadow)}
/* ---------- Einrichtungsassistent ---------- */
.wz{display:grid;grid-template-columns:230px minmax(0,1fr);gap:14px;align-items:start;max-width:1000px}
.vsteps{display:flex;flex-direction:column;gap:2px;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.vsteps div{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--muted);font-weight:500}
.vsteps i{width:24px;height:24px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;flex:none}
.vsteps .done{color:var(--fg)}.vsteps .done i{background:var(--ok);color:#fff}
.vsteps .cur{background:var(--accent-soft);color:var(--fg);font-weight:650}.vsteps .cur i{background:var(--accent);color:#2b1c00}
.vsteps .skip{opacity:.7;font-size:13px}
.headline{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0 0 2px;text-wrap:balance}
.wsteps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:14px 0}
.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:14px 0}
.choice button{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;cursor:pointer;font:inherit;color:var(--fg);min-width:0}
.choice button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.choice b{display:block;margin-bottom:2px;overflow-wrap:anywhere}
.choice span{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.livebox{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:10px 0}
.livebox b{font-size:26px;letter-spacing:-.02em}
.livebox span{color:var(--muted);font-size:13px}
.check{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.check:last-child{border:0}
.check .ic{font-weight:700;width:18px;flex:none}
.check .ic.ok{color:var(--ok)}.check .ic.warn{color:var(--warn)}.check .ic.error{color:var(--bad)}
.wfoot{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.wfoot span{color:var(--muted);font-size:13px;margin-right:auto}
button.sec2{border:1px solid var(--line);background:var(--chip);border-radius:12px;padding:9px 18px;font:inherit;font-weight:600;cursor:pointer;color:var(--fg)}
/* ---------- Handy ---------- */
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;max-height:88vh;border-right:0;border-top:1px solid var(--line);border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .2s;z-index:40;padding-bottom:env(safe-area-inset-bottom,0px)}
  .side.open{transform:none;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
  .side .brand{display:none}
  .scrim.on{display:block;position:fixed;inset:0;background:rgb(0 0 0/.35);z-index:35}
  .bar{position:static;padding:10px 16px}
  .bar h1{display:none}
  main{padding:16px 16px 96px}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;font:inherit;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button[aria-current="page"]{color:var(--fg)}
  .tabbar button[aria-current="page"] svg{stroke:var(--accent-d)}
  .tabbar button[aria-current="page"]:before{content:"";position:absolute;top:-7px;width:28px;height:3px;border-radius:2px;background:var(--accent)}
  .cols,.wz{grid-template-columns:minmax(0,1fr)}
  main.hasset{display:block}
  .subnav{flex-direction:row;overflow-x:auto;gap:4px;margin-bottom:12px;position:static}
  .subnav button{white-space:nowrap}
  .vsteps{flex-direction:row;overflow-x:auto;padding:8px}
  .vsteps div{white-space:nowrap;flex:none}
  .vsteps .skip{display:none}
  #toast{bottom:92px}
}
body.dens-compact{font-size:13.5px}
body.dens-large{font-size:16.5px}

<body>
<div class="shell">
  <aside class="side" id="side">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f97316"/></linearGradient></defs>
        <g stroke="url(#lg)" stroke-width="4" stroke-linecap="round"><path d="M32 4v8M32 52v8M4 32h8M52 32h8M12 12l6 6M46 46l6 6M12 52l6-6M46 18l6-6"/></g>
        <circle cx="32" cy="32" r="15" fill="url(#lg)"/><circle cx="32" cy="32" r="7" fill="#fff7e0"/></svg>
      <div><b>SOLASI</b><small>Dein Energie-Regler</small></div>
    </div>
    <nav class="nav" id="nav" aria-label="Hauptmenü"></nav>
    <div class="side-foot">
      <span class="pill" id="connpill"><i></i><span id="conntext">Verbinde …</span></span>
      <span id="mqttline"></span>
      <label class="tg" title="Zeigt zusätzliche Einstellungen für Fortgeschrittene"><input type="checkbox" id="q_expert"><i></i>Experte</label>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="content">
    <div class="bar">
      <h1 id="title">Übersicht</h1>
      <span class="pill" id="modepill"><i></i><span id="modetext">–</span></span>
      <label class="tg"><input type="checkbox" id="q_enabled"><i></i>Regelung</label>
      <label class="tg test"><input type="checkbox" id="q_dry"><i></i>Testmodus</label>
      <button class="kill" id="killbtn" type="button" title="Stoppt SOLASI und gibt die Speicher an ihren eigenen Modus zurück">⛔ Not-Aus</button>
    </div>
    <main id="main">
      <div id="subnav" class="subnav"></div>
      <div id="pagetools">
        <label class="tg" id="tg_sp"><input type="checkbox" id="q_sp"><i></i>Überschuss</label>
        <label class="tg test" id="tg_spdry"><input type="checkbox" id="q_spdry"><i></i>Überschuss-Test</label>
      </div>
      <section class="page act" id="p-status"></section>
      <section class="page" id="p-setup"></section>
      <section class="page" id="p-units"></section>
      <section class="page" id="p-control"></section>
      <section class="page" id="p-surplus"></section>
      <section class="page" id="p-meters"></section>
      <section class="page" id="p-extras"></section>
      <section class="page" id="p-look"></section>
      <section class="page" id="p-stats"></section>
      <section class="page" id="p-replay"></section>
      <section class="page" id="p-selftest"></section>
      <section class="page" id="p-card"></section>
      <section class="page" id="p-mqtt"></section>
      <section class="page" id="p-log"><div class="card"><div class="log" id="log"></div></div></section>
      <div class="savebar" id="savebar"><span class="msg" id="savemsg">Änderungen gelten erst nach „Speichern“.</span>
        <button class="primary" id="save">Speichern</button></div>
    </main>
  </div>
</div>
<nav class="tabbar" id="tabbar" aria-label="Schnellwahl"></nav>
<div id="toast"></div>
<datalist id="dl-sensor"></datalist><datalist id="dl-number"></datalist><datalist id="dl-select"></datalist>
<datalist id="dl-script"></datalist><datalist id="dl-fb0"></datalist><datalist id="dl-fb1"></datalist><datalist id="dl-sens0"></datalist><datalist id="dl-sens1"></datalist><datalist id="dl-notify"></datalist><datalist id="dl-switchy"></datalist><datalist id="dl-all"></datalist>

<script>
let cfg = null, dirty = false, lastStatus = null;
const $ = s => document.querySelector(s);
const SW = ["switch","input_boolean","light","fan","climate","script","automation"];
let allSensors=[];

// ---------- Hilfen ----------
function get(path){return path.split(".").reduce((o,k)=>o==null?o:o[k],cfg)}
function set(path,v){const ks=path.split(".");let o=cfg;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks.at(-1)]=v;markDirty()}
function markDirty(){dirty=true;$("#savemsg").textContent="Du hast ungespeicherte Änderungen";}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2200)}

let expert=false;try{expert=localStorage.getItem("solasi_expert")==="1"}catch(e){}
let advHidden=0;
function field(path,label,kind,o={}){
  if(o.adv&&!expert){advHidden++;return "";}
  const id="f_"+path.replace(/\./g,"_");
  let inner="";
  const v=get(path);
  if(kind==="bool") inner=`<input type="checkbox" id="${id}" ${v?"checked":""}>`;
  else if(kind==="select") inner=`<select id="${id}">${o.options.map(([val,t])=>`<option value="${val}" ${v===val?"selected":""}>${esc(t)}</option>`).join("")}</select>`;
  else if(kind==="num") inner=`<input type="number" id="${id}" value="${esc(v)}" ${o.min!=null?`min="${o.min}"`:""} ${o.max!=null?`max="${o.max}"`:""} step="${o.step??1}">`;
  else inner=`<input type="text" id="${id}" value="${esc(v)}" ${o.list?`list="dl-${o.list}"`:""} ${o.ph?`placeholder="${esc(o.ph)}"`:""} autocomplete="off">`;
  setTimeout(()=>{const e=document.getElementById(id);if(!e)return;
    e.addEventListener(kind==="bool"||kind==="select"?"change":"input",()=>{
      let val=kind==="bool"?e.checked:kind==="num"?(e.value===""?0:parseFloat(e.value)):e.value.trim();
      set(path,val);if(o.after)o.after(val);});},0);
  return `<div class="f"><label for="${id}">${esc(label)}</label><div>${inner}</div>${o.hint?`<div class="hint">${esc(o.hint)}</div>`:""}</div>`;
}
const fs=(title,body,o={})=>body.trim()?`<details class="fsec" ${o.closed?"":"open"}><summary>${esc(title)}${o.sub?` <span class="sub">${esc(o.sub)}</span>`:""}</summary><div class="fbody">${body}</div></details>`:"";
function advNote(){return advHidden?`<div class="advnote">${advHidden} weitere Einstellungen gibt es im Experten-Modus (Schalter oben).</div>`:""}

// ---------- Speichertypen (Treiber) ----------
const DRV={
  anker:{label:"Anker SOLIX (Betrag + Richtung)",desc:"Eine Zahl für die Leistung und eine Auswahl für die Richtung. Für die offizielle Anker-Integration (Solarbank 4 E5000 Pro, Max AC).",charge:true,curtail:true},
  signed:{label:"Eine Zahl mit Vorzeichen",desc:"Ein Wert steuert alles: positiv = Entladen, negativ = Laden (Vorzeichen umstellbar). Passt z. B. zu Marstek im Passiv-Modus.",charge:true,curtail:false},
  modal:{label:"Modus + Leistungen",desc:"Eine Auswahl (Stop / Laden / Entladen) plus je eine Zahl für Entlade- und Ladeleistung. Passt z. B. zu Marstek über Modbus.",charge:true,curtail:true},
  limit:{label:"Ausgangslimit (nur Entladen)",desc:"Eine Zahl begrenzt die Abgabe ins Haus, geladen wird nur über PV. Passt z. B. zu Wechselrichter-Limits (OpenDTU) und Speichern mit Ausgangslimit.",charge:false,curtail:false},
  script:{label:"Eigenes Skript (für alles andere)",desc:"SOLASI ruft ein Home-Assistant-Skript auf und übergibt power_w (+ Entladen, − Laden), mode (discharge, charge oder idle) und unit. Damit lässt sich jedes System anbinden.",charge:true,curtail:false}
};
const isConf=u=>{const d=u.driver||"anker";return d==="anker"?!!(u.num&&u.dir):d==="modal"?!!(u.dir&&u.num):d==="script"?!!u.script:!!u.num};

function unitFields(i,u){
  const p=`units.${i}.`,d=u.driver||"anker",D=DRV[d]||DRV.anker;
  let h=field(p+"name","Name","text");
  h+=field(p+"driver","Speichertyp","select",{options:Object.entries(DRV).map(([k,v])=>[k,v.label]),
    after:dd=>{set(p+"curtail",!!DRV[dd].curtail);set(p+"can_charge",DRV[dd].charge);renderUnits();}});
  h+=`<div class="drvdesc">${esc(D.desc)}</div>`;
  if(d==="anker"){
    h+=field(p+"num","Leistung (number)","text",{list:"number",hint:"Die Entität „Leistungssteuerung“ des Speichers."})+
       field(p+"dir","Leistungsfluss / Richtung (select)","text",{list:"select"})+
       field(p+"mode","Betriebsmodus (select)","text",{list:"select",hint:"SOLASI setzt ihn vor dem Steuern auf „third_party_control“."})+
       field(p+"dir_dis","Richtung „Entladen“ (leer = global)","text",{adv:true})+
       field(p+"dir_chg","Richtung „Laden“ (leer = global)","text",{adv:true})+
       field(p+"mode_option","Modus für externe Steuerung (leer = global)","text",{adv:true});
  }else if(d==="signed"){
    h+=field(p+"num","Leistung (number, mit Vorzeichen)","text",{list:"number"})+
       field(p+"sign","Vorzeichen der Zahl","select",{options:[["discharge_positive","positiv = Entladen, negativ = Laden"],["charge_positive","positiv = Laden, negativ = Entladen"]]})+
       field(p+"mode","Arbeitsmodus (select, optional)","text",{list:"select",hint:"Wird vor dem Steuern auf die Option unten gesetzt (z. B. Passiv)."})+
       field(p+"mode_option","Option für den Arbeitsmodus","text");
  }else if(d==="modal"){
    h+=field(p+"dir","Modus Stop / Laden / Entladen (select)","text",{list:"select"})+
       field(p+"num","Entladeleistung (number)","text",{list:"number"})+
       field(p+"num_chg","Ladeleistung (number, optional)","text",{list:"number",hint:"Ohne diese Zahl wird der Speicher nicht aus dem Netz geladen."})+
       field(p+"enable","Fernsteuerung (Schalter, optional)","text",{list:"switchy",hint:"Wird vor dem Steuern eingeschaltet (z. B. RS485-Steuerung)."})+
       field(p+"mode","Arbeitsmodus (select, optional)","text",{list:"select"})+
       field(p+"mode_option","Option für den Arbeitsmodus","text")+
       field(p+"dir_dis","Option „Entladen“","text",{adv:true})+
       field(p+"dir_chg","Option „Laden“","text",{adv:true})+
       field(p+"dir_stop","Option „Stop“","text",{adv:true});
  }else if(d==="limit"){
    h+=field(p+"num","Ausgangslimit (number)","text",{list:"number"});
  }else{
    h+=field(p+"script","Skript","text",{list:"script",hint:"Das Skript erhält die Felder power_w, mode und unit."});
  }
  if(d==="anker"||d==="signed"||d==="modal"){
    h+=field(p+"fallback_mode","Beim Stoppen: Modus setzen auf","text",{list:"fb"+i,
      hint:"Der Speicher bekommt diesen Modus, wenn du SOLASI stoppst oder etwas ausfällt, z. B. Eigenverbrauch. Trage oben den Betriebsmodus ein, dann erscheinen hier seine Optionen als Vorschläge. Du kannst den Namen auch von Hand eintippen."});
  }else if(d==="limit"){
    h+=field(p+"fallback_value","Beim Stoppen: Ausgangslimit setzen auf (W)","text",{hint:"Leer = Limit unverändert lassen."});
  }
  const L="sens"+i;
  h+=field(p+"soc","Ladestand SOC (%)","text",{list:L});
  if(d==="anker"){
    h+=field(p+"real_dis","Entladeleistung (Sensor, optional)","text",{list:L,hint:"Leistung, mit der der Speicher gerade abgibt (laut „Messart“ unten)."})+
       field(p+"real_chg","Ladeleistung (Sensor, optional)","text",{list:L,hint:"Leistung, mit der der Speicher gerade lädt (laut „Messart“ unten)."});
  }else{
    h+=field(p+"power","Leistung (Sensor mit Vorzeichen, optional)","text",{list:L,hint:"Für Failsafe, Hausverbrauch, Statistik und Lernen."})+
       field(p+"power_sign","Vorzeichen des Sensors","select",{options:[["discharge_positive","positiv = Entladen"],["charge_positive","positiv = Laden"]]});
  }
  h+="\u0001"+field(p+"pv","PV-Leistung der Module","text",{list:L,hint:"Die Solarleistung dieses Speichers. Wird gebraucht, damit die PV auch bei leerem Speicher direkt ins Haus gehen kann, und für den Hausverbrauch bei Messart „Batterie“."})+
     field(p+"power_basis","Messart der Leistungssensoren","select",{options:[["","Automatisch"],["ac","Leistung am Hausanschluss (AC)"],["battery","Leistung an der Batterie (DC)"]],
       hint:"Anker mit PV-Sensor misst an der Batterie (Laden und Entladen der Batterie, Solar kommt dazu). Prüfe unter System → Selbsttest → Energiebilanz, ob die Werte zur Hersteller-App passen."})+
     `<div class="f"><label>Sensoren dieses Geräts</label><div id="devsens${i}" class="sub">${(u.num||u.dir||u.script)?"lädt …":"Erst Leistung bzw. Modus wählen."}</div></div>`+
     field(p+"max_dis","Max. Entladeleistung (W)","num",{min:0,step:10})+
     (D.charge?field(p+"max_chg","Max. Ladeleistung (W)","num",{min:0,step:10}):"")+
     (D.charge?field(p+"can_charge","Aus dem Netz laden erlauben","bool",{adv:true}):"")+
     (D.curtail?field(p+"curtail","Abregelung bei vollem Speicher erzwingen","bool",{adv:true,hint:"Stellt den vollen Speicher auf „Entladen“ mit 0 W bzw. Hausbedarf."}):"")+
     field(p+"capacity_kwh","Nutzbare Kapazität (kWh)","num",{min:0.5,step:0.1,adv:true,hint:"Nur für den Replay."});
  return h;
}
function renderUnits(){
  advHidden=0;
  let h=fs("⚡ Stromzähler",
    field("grid.entity","Netzleistung (W)","text",{list:"sensor",hint:"Positiv = Bezug, negativ = Einspeisung. Am besten der rohe oder kurz geglättete Wert (z. B. Bitshake)."})+
    field("grid.invert","Vorzeichen umkehren","bool",{hint:"Nur nötig, wenn dein Zähler Einspeisung positiv meldet."})+
    field("grid.max_age","Ausfall erkennen nach (Sekunden)","num",{min:0,adv:true,hint:"Meldet der Zähler so lange nichts, gehen die Speicher auf 0 W. 0 = nur bei „nicht verfügbar“."}));
  cfg.units.forEach((u,i)=>{
    const conf=isConf(u);
    h+=fs(`🔋 ${esc(u.name||("Speicher "+(i+1)))}${i?" (optional)":""}`,unitFields(i,u).replace("\u0001",""),{closed:!conf&&i>0,sub:conf?(DRV[u.driver||"anker"]||DRV.anker).label:"nicht eingerichtet"});
  });
  $("#p-units").innerHTML=h.replace(/\u0001/g,"")+advNote();
  cfg.units.forEach((u,i)=>{
    setSensorList(i,[]);                 // sofort: alle Sensoren vorschlagen, auch beim ersten Einrichten
    refreshDevice(i);refreshModeOptions(i);
    for(const k of ["num","dir","script"]){const e=document.getElementById(`f_units_${i}_${k}`);if(e)e.addEventListener("input",()=>later("dev"+i,()=>refreshDevice(i)));}
    const m=document.getElementById(`f_units_${i}_mode`);if(m)m.addEventListener("input",()=>later("mode"+i,()=>refreshModeOptions(i)));
  });
}
// ---- Vorschlagslisten je Speicher: erst alle Sensoren, dann (wenn möglich) die des Geräts zuerst ----
const timers={};
function later(key,fn,ms=400){clearTimeout(timers[key]);timers[key]=setTimeout(fn,ms)}
function setSensorList(i,list){
  const dl=document.getElementById("dl-sens"+i);if(!dl)return;
  const fmt=x=>`${x.name||x.id} · ${x.state}${x.unit?" "+x.unit:""}`;
  const ids=new Set(list.map(x=>x.id));
  dl.innerHTML=list.map(x=>`<option value="${esc(x.id)}" label="${esc(fmt(x))}"></option>`).join("")+
    (allSensors||[]).filter(e=>!ids.has(e.id)).map(e=>`<option value="${esc(e.id)}" label="${esc(e.name)}"></option>`).join("");
}
async function refreshDevice(i){
  const u=cfg.units[i],anchor=u.num||u.dir||u.script,box=document.getElementById("devsens"+i);
  if(!anchor){if(box)box.textContent="Erst Leistung bzw. Modus wählen, dann erscheinen hier die Sensoren des Geräts.";return;}
  if(box)box.textContent="lädt …";
  try{
    const list=await (await fetch("api/device_sensors?entity="+encodeURIComponent(anchor))).json();
    if(!Array.isArray(list))throw new Error("keine Liste");
    setSensorList(i,list);
    if(box)box.innerHTML=list.length?`<details><summary>${list.length} Sensoren gefunden, mit aktuellem Wert</summary>
      <table style="width:100%;border-collapse:collapse;margin-top:6px;font-size:13px">${list.map(x=>`<tr style="border-bottom:1px solid var(--line)"><td style="padding:3px 6px 3px 0">${esc(x.name||x.id)}<div class="sub" style="font-size:11px">${esc(x.id)}</div></td><td style="text-align:right;white-space:nowrap"><b>${esc(x.state)}</b> ${esc(x.unit)}</td></tr>`).join("")}</table>
      <div class="hint" style="margin-top:6px">Vergleiche die Werte mit der Hersteller-App, um den richtigen Sensor für Solar, Laden und Entladen zu finden.</div></details>`:"Keine passenden Sensoren gefunden. Du kannst trotzdem jeden Sensor aus der Liste oder von Hand wählen.";
  }catch(e){if(box)box.textContent="Die Sensorliste des Geräts ist nicht verfügbar. Alle Sensoren stehen trotzdem zur Auswahl.";}
}
async function refreshModeOptions(i){
  const dl=document.getElementById("dl-fb"+i),mode=cfg.units[i].mode;if(!dl)return;
  if(!mode){dl.innerHTML="";return;}
  try{const j=await (await fetch("api/entity_options?entity="+encodeURIComponent(mode))).json();
    dl.innerHTML=(j.options||[]).map(o=>`<option value="${esc(o)}"></option>`).join("");}catch(e){}
}
function renderControl(){
  advHidden=0;
  const f="features.",c="control.",s="soc.";
  $("#p-control").innerHTML=
   fs("✨ Funktionen",
    field(f+"eco","Eco-Modus","bool",{hint:"Drosselt die Entladung bei niedrigem Ladestand, damit der Akku bis zum Morgen reicht."})+
    field(f+"thresholds","Schwellen verwenden","bool",{hint:"Aus = es wird schon bei kleinsten Abweichungen geregelt."})+
    field(f+"ac_charge","Laden aus Fremd-Überschuss erlauben","bool",{hint:"Z. B. von einer anderen PV-Anlage am Zähler."})+
    field(f+"strict_zero","Strenge Nulleinspeisung bei vollem Speicher","bool",{hint:"Voller Speicher wird auf „Entladen“ gestellt, damit er die PV drosselt (nur bei Speichertypen, die das können)."})+
    field(f+"enforce_mode","Externe Steuerung automatisch einschalten","bool",{hint:"Sobald SOLASI live steuert, stellt es den Betriebsmodus des Speichers auf die Option für externe Steuerung (bei Anker „third_party_control“): beim Start, nach „Fortsetzen“ und wenn der Modus von außen verstellt wird, auch wenn gerade nichts zu regeln ist. Zum Zurückgeben dient der Not-Aus."})+
    field(f+"pv_passthrough","PV direkt ins Haus geben, auch bei leerem Speicher","bool",{hint:"Liegt der Ladestand unter dem Minimum, darf der Speicher trotzdem so viel abgeben, wie seine Module gerade liefern. Die Batterie wird dabei nicht entladen. Braucht den PV-Sensor je Speicher."})+
    field(f+"failsafe","Failsafe","bool",{hint:"Bei Zähler-Ausfall gehen die Speicher auf 0 W. Außerdem wird 0 W erneut gesendet, wenn die echte Leistung noch fließt."}))+
   fs("🎚️ Regelung",
    field(c+"split","Aufteilung auf beide Speicher","select",{options:[["equal","Gleichmäßig"],["soc","Nach Ladestand"],["sequential","Nacheinander"]]})+
    field(c+"total_max_dis","Gesamtlimit Entladung (W)","num",{min:0,step:10,hint:"Vorsichtshalber 800 W (Balkonkraftwerk-Grenze). Für größere Anlagen erhöhen."})+
    field(c+"total_max_chg","Gesamtlimit Laden (W)","num",{min:0,step:10})+
    field(c+"min_gap","Mindestabstand zwischen Regelschritten (s)","num",{min:1,adv:true,hint:"Die Speicher melden oft nur alle ca. 5 s. Unter 4 s schwingt die Regelung meist."})+
    field(c+"heartbeat","Zusätzlicher Takt (s)","num",{min:1,adv:true,hint:"Regelt auch dann, wenn der Zähler lange nichts meldet."})+
    field(c+"threshold_on","Einschalt-Schwelle (W)","num",{min:0,step:10,adv:true})+
    field(c+"threshold_off","Ausschalt-Schwelle (W)","num",{min:0,step:10,adv:true})+
    field(c+"offset_discharge","Beim Entladen übrig lassen (W Netzbezug)","num",{min:0,step:5,adv:true})+
    field(c+"offset_charge","Beim Laden übrig lassen (W Einspeisung)","num",{min:0,step:5,adv:true})+
    field(c+"step","Rundung / kleinste Änderung (W)","num",{min:1,adv:true}))+
   fs("🔋 Akku-Grenzen & Eco",
    field(s+"min","Nicht entladen unter (%)","num",{min:0,max:100})+
    field(s+"max","Nicht laden über (%)","num",{min:0,max:100})+
    field(s+"hyst","Hysterese (%-Punkte)","num",{min:0,max:30,adv:true})+
    field(s+"eco_threshold","Eco-Modus ab mittlerem Ladestand (%)","num",{min:0,max:100})+
    field(s+"base_load","Eco-Entladeleistung gesamt (W)","num",{min:0,step:10,hint:"Etwa die nächtliche Grundlast deines Hauses. Gilt, solange das Lernen aus ist oder noch kein Wert vorliegt."})+
    field(s+"learn_base_load","Eco-Leistung aus gelernter Grundlast","bool",{hint:"SOLASI misst die Grundlast nachts und passt die Eco-Leistung automatisch an. Braucht die echten Leistungssensoren oder einen Hausverbrauchs-Sensor."})+
    field(s+"base_load_margin","Zuschlag auf die gelernte Grundlast (%)","num",{min:0,max:100,adv:true})+
    field(s+"base_load_min","Eco-Leistung mindestens (W)","num",{min:0,step:10,adv:true})+
    field(s+"base_load_max","Eco-Leistung höchstens (W)","num",{min:0,step:10,adv:true})+

// ---------- Diagramme ----------
function niceStep(range,ticks=4){const raw=Math.max(range,1e-9)/ticks,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;return(f<=1?1:f<=2?2:f<=5?5:10)*p}
function lineChart(series,{h=210,unit="W",title=""}={}){
  const all=series.flatMap(x=>x.data);if(!all.length)return "";
  let lo=Math.min(0,...all),hi=Math.max(...all,1);if(hi===lo)hi=lo+1;
  const st=niceStep(hi-lo);lo=Math.floor(lo/st)*st;hi=Math.ceil(hi/st)*st;
  const W0=640,pl=44,pr=10,pt=10,pb=22,iw=W0-pl-pr,ih=h-pt-pb;
  const X=(i,n)=>pl+(n<=1?0:i/(n-1))*iw,Y=v=>pt+(1-(v-lo)/(hi-lo))*ih;
  const ticks=Math.max(1,Math.round((hi-lo)/st));let g="";
  for(let i=0;i<=ticks;i++){const v=lo+(hi-lo)*i/ticks;g+=`<line x1="${pl}" x2="${W0-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end" class="axis">${Math.round(v)}</text>`;}
  const zero=lo<0?`<line x1="${pl}" x2="${W0-pr}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--muted)" stroke-dasharray="4 4"/>`:"";
  const lines=series.map(x=>`<polyline fill="none" stroke="${x.color}" stroke-width="${x.w||2}" ${x.dash?`stroke-dasharray="${x.dash}"`:""} points="${x.data.map((v,i)=>X(i,x.data.length).toFixed(1)+","+Y(v).toFixed(1)).join(" ")}"/>`).join("");
  const legend=series.map((x,i)=>`<span class="lg"><i style="background:${x.color}"></i>${esc(x.name)}</span>`).join("");
  return `<div class="legend">${legend}<span class="sub">${esc(title)}</span></div><svg viewBox="0 0 ${W0} ${h}" class="chart" role="img">${g}${zero}${lines}<text x="${pl}" y="${h-4}" class="axis">Start</text><text x="${W0-pr}" y="${h-4}" text-anchor="end" class="axis">Ende</text></svg>`;
}
function barChart(days,keys,{h=200}={}){
  if(!days.length)return "";
  const W0=640,pl=40,pr=8,pt=8,pb=34,iw=W0-pl-pr,ih=h-pt-pb;
  const top=Math.max(1,...days.flatMap(d=>keys.map(k=>d[k.key]||0))),bst=niceStep(top),hi=Math.ceil(top/bst)*bst,bt=Math.max(1,Math.round(hi/bst));
  const gw=iw/days.length,bw=Math.min(18,(gw-4)/keys.length);
  let g="";
  for(let i=0;i<=bt;i++){const v=hi*i/bt,y=pt+(1-i/bt)*ih;g+=`<line x1="${pl}" x2="${W0-pr}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl-5}" y="${y+4}" text-anchor="end" class="axis">${bst<1?v.toFixed(1):Math.round(v)}</text>`;}
  let bars="";
  days.forEach((d,i)=>{const x0=pl+i*gw+(gw-bw*keys.length)/2;
    keys.forEach((k,j)=>{const v=d[k.key]||0,bh=(v/hi)*ih;bars+=`<rect x="${x0+j*bw}" y="${pt+ih-bh}" width="${bw-1}" height="${bh}" rx="2" fill="${k.color}"><title>${d.date}: ${k.name} ${v} kWh</title></rect>`;});
    if(days.length<=16||i%Math.ceil(days.length/12)===0)bars+=`<text x="${pl+i*gw+gw/2}" y="${h-pb+14}" text-anchor="middle" class="axis">${d.date.slice(8)}.${d.date.slice(5,7)}.</text>`;});
  const legend=keys.map(k=>`<span class="lg"><i style="background:${k.color}"></i>${esc(k.name)}</span>`).join("");
  return `<div class="legend">${legend}<span class="sub">kWh pro Tag</span></div><svg viewBox="0 0 ${W0} ${h}" class="chart" role="img">${g}${bars}</svg>`;
}

    <div class="sub">Spielt echte Verlaufsdaten aus Home Assistant durch die Regelung. So testest du andere Einstellungen, ohne die Anlage anzufassen.<br>

        :`<select data-rp="${path}"><option value="">wie bisher (${v})</option><option value="equal">gleichmäßig</option><option value="soc">nach Ladestand</option><option value="sequential">nacheinander</option></select>`;
      return `<div class="f"><label>${label}</label><div>${input}</div></div>`;}).join(""))}

async function runReplay(){
  const overrides={};
  document.querySelectorAll("#p-replay [data-rp]").forEach(e=>{
    const v=e.value;if(v==="")return;const path=e.dataset.rp;
    overrides[path]=e.tagName==="INPUT"?parseFloat(v):(v==="1"?true:v==="0"?false:v);});
  const b=document.getElementById("rprun");b.disabled=true;$("#rpmsg").textContent="Lade Verlauf und simuliere …";
  try{
    const r=await fetch("api/replay",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({hours:+$("#rp_hours").value,curtail:$("#rp_curtail").checked,overrides})});
    const j=await r.json();if(!j.ok)throw new Error(j.error);
    renderReplay(j);$("#rpmsg").textContent="Fertig.";
  }catch(e){$("#rpout").innerHTML=`<div class="banner bad">⚠️ ${esc(e.message)}</div>`;$("#rpmsg").textContent="Fehler";}
  b.disabled=false;
}
function renderReplay(j){
  const a=j.actual,c=j.current,x=j.alt;
  const row=(l,av,cv,xv,fmt=v=>v)=>`<div class="row"><span>${l}</span><span style="display:flex;gap:18px"><b style="width:70px;text-align:right">${av==null?"–":fmt(av)}</b><b style="width:70px;text-align:right">${cv==null?"–":fmt(cv)}</b>${j.alt?`<b style="width:70px;text-align:right;color:var(--test)">${xv==null?"–":fmt(xv)}</b>`:""}</span></div>`;
  const dev=a.imp>0.2?Math.round(Math.abs(c.imp-a.imp)/a.imp*100):null;
  const diffTxt=j.alt?(()=>{const d=x.imp-c.imp;return `Mit den geänderten Einstellungen läge der Netzbezug um <b>${Math.abs(d).toFixed(2)} kWh ${d<0?"niedriger":"höher"}</b> und die Einspeisung um <b>${Math.abs(x.exp-c.exp).toFixed(2)} kWh ${x.exp<c.exp?"niedriger":"höher"}</b>.`})():"";
  $("#rpout").innerHTML=`<div class="card" style="margin-top:14px"><h3>Ergebnis für ${j.hours} Stunden</h3>
    <div class="row" style="font-size:12px;color:var(--muted)"><span></span><span style="display:flex;gap:18px"><span style="width:70px;text-align:right">Gemessen</span><span style="width:70px;text-align:right">Sim. jetzt</span>${j.alt?`<span style="width:70px;text-align:right;color:var(--test)">Sim. neu</span>`:""}</span></div>
    ${row("Netzbezug (kWh)",a.imp,c.imp,x&&x.imp)}${row("Einspeisung (kWh)",a.exp,c.exp,x&&x.exp)}
    ${row("Ladestand am Ende (%)",a.end_soc,c.end_soc,x&&x.end_soc)}${row("Niedrigster Ladestand (%)",a.min_soc,c.min_soc,x&&x.min_soc)}
    ${row("Speicher entladen (kWh)",null,c.bat_dis,x&&x.bat_dis)}${row("Abgeregelte PV (kWh)",null,c.curtailed,x&&x.curtailed)}
    ${row("Sollwert-Änderungen",null,c.writes,x&&x.writes)}${row("Eco-Modus (Stunden)",null,c.eco_h,x&&x.eco_h)}
    ${diffTxt?`<div style="margin-top:10px">${diffTxt}</div>`:""}
    <div class="sub" style="margin-top:8px">${dev==null?"":`Modell-Check: Der simulierte Netzbezug mit den aktuellen Einstellungen weicht um ${dev} % vom gemessenen ab. `}Das Modell ist eine Näherung: Lastgang und PV kommen aus der Historie, der Speicher wird vereinfacht nachgebildet.</div></div>
    <div class="card" style="margin-top:14px"><h3>Netzleistung</h3>${lineChart([{name:"Gemessen",color:"#94a3b8",data:a.series.grid},{name:"Simulation jetzt",color:"#f59e0b",data:c.series.grid},...(x?[{name:"Simulation neu",color:"#8b5cf6",data:x.series.grid}]:[])],{title:"W, positiv = Bezug"})}</div>
    <div class="card" style="margin-top:14px"><h3>Ladestand</h3>${lineChart([{name:"Gemessen",color:"#94a3b8",data:a.series.soc},{name:"Simulation jetzt",color:"#f59e0b",data:c.series.soc},...(x?[{name:"Simulation neu",color:"#8b5cf6",data:x.series.soc}]:[])],{title:"mittlerer SOC in %"})}</div>`;
}

const WSTEPS=["Willkommen","Zähler","Speicher","Solar und Haus","Prüfen","Testlauf"];
let wz={step:0,second:false,check:null,busy:false};
const GRID_HINT=/netz|grid|zähler|zaehler|bezug|meter|bitshake|shelly|tibber|power|leistung|haupt|total|gesamt/i;
function gridCandidates(){
  const l=(allSensors||[]).filter(e=>(e.unit||"").toLowerCase()==="w"||(e.unit||"").toLowerCase()==="kw");
  const sc=e=>(GRID_HINT.test(e.id+" "+(e.name||""))?2:0)+(/pv|solar|batter|akku|speicher|ladeleist|entlade/i.test(e.id+" "+(e.name||""))?-3:0);
  return l.map(e=>[sc(e),e]).sort((a,b)=>b[0]-a[0]).slice(0,5).map(x=>x[1]);
}
function wizBody(){
  const st=wz.step,u0=cfg.units[0];
  if(st===0)return `<p class="headline">Willkommen bei SOLASI</p>
    <div class="sub">SOLASI regelt deinen Heimspeicher so, dass möglichst nichts ins Netz geht und der Solarstrom im Haus bleibt.</div>
    <div class="wsteps">
      <div class="step"><b>1</b><div><strong>Zähler wählen</strong><div class="sub">Der Sensor an deinem Hausanschluss.</div></div></div>
      <div class="step"><b>2</b><div><strong>Speicher einrichten</strong><div class="sub">Leistung, Richtung, Modus und Ladestand.</div></div></div>
      <div class="step"><b>3</b><div><strong>Prüfen und testen</strong><div class="sub">SOLASI startet im Testmodus und sendet nichts.</div></div></div></div>
    <div class="sub">Das dauert etwa fünf Minuten. Du kannst jederzeit zurück und später alles unter „Speicher“ und „Einstellungen“ ändern.</div>`;
  if(st===1){
    const c=gridCandidates(),cur=cfg.grid.entity,ent=(allSensors||[]).find(e=>e.id===cur);
    let h=`<p class="headline">Welcher Sensor misst deinen Netzbezug?</p>
      <div class="sub">Das ist der Zähler am Hausanschluss. Positiv bedeutet Bezug, negativ Einspeisung. SOLASI schlägt passende Sensoren vor.</div>`;
    if(c.length)h+=`<div class="choice" id="wz_grid" role="group" aria-label="Zähler wählen">${c.map(e=>`<button type="button" data-id="${esc(e.id)}" aria-pressed="${e.id===cur}"><b>${esc(e.name||e.id)}</b><span>${esc(e.id)} · ${esc(e.state)} ${esc(e.unit||"")}</span></button>`).join("")}</div>`;
    h+=field("grid.entity","Anderer Sensor","text",{list:"sensor",ph:"sensor.netzleistung"});
    if(cur){
      const val=ent?Number(String(ent.state).replace(",",".")):NaN,unit=(ent&&ent.unit||"").toLowerCase();
      h+=`<div class="livebox"><div><span>Aktueller Wert</span><br><b>${ent&&isFinite(val)?esc(ent.state)+" "+esc(ent.unit||""):"–"}</b></div>
        <span>${ent?"Sensor gefunden":"Dieser Sensor ist in Home Assistant nicht bekannt"}</span></div>`;
      const chk=(ok,t)=>`<div class="check"><span class="ic ${ok?"ok":"warn"}">${ok?"✓":"!"}</span><span>${t}</span></div>`;
      h+=chk(!!ent&&isFinite(val),"Der Sensor liefert eine Zahl")+
         chk(unit==="w","Einheit ist Watt"+(unit==="kw"?" (der Sensor meldet kW, bitte einen Watt-Sensor wählen)":""));
    }
    h+=field("grid.invert","Vorzeichen umkehren","bool",{hint:"Nur nötig, wenn dein Zähler Einspeisung positiv meldet."});
    return h;
  }
  if(st===2){
    let h=`<p class="headline">Wie wird dein Speicher gesteuert?</p><div class="sub">Wähle den Typ, dann die Entitäten. Die Vorschläge kommen aus deinem Home Assistant.</div>`;
    h+=unitFields(0,u0).split("\u0001")[0];
    if(wz.second||isConf(cfg.units[1]))h+=`<h2 style="margin:18px 0 6px">Zweiter Speicher</h2>`+unitFields(1,cfg.units[1]).split("\u0001")[0];
    else h+=`<p><button type="button" class="sec2" id="wz_second">Zweiten Speicher hinzufügen</button></p>`;
    return h;
  }
  if(st===3){
    let h=`<p class="headline">Solar und Leistungsgrenzen</p><div class="sub">Damit auch bei leerem Speicher Solarstrom ins Haus geht und die Anzeige stimmt. Leere Felder sind in Ordnung.</div>`;
    cfg.units.forEach((u,i)=>{ if(i===0||wz.second||isConf(u))h+=`<h2 style="margin:14px 0 4px">${esc(u.name||"Speicher "+(i+1))}</h2>`+(unitFields(i,u).split("\u0001")[1]||""); });
    return h;
  }
  if(st===4){
    if(!wz.check)return `<p class="headline">Prüfe deine Einstellungen …</p><div class="sub">SOLASI speichert und testet die Verbindung zu deinen Entitäten.</div>`;
    const it=wz.check.items||[],bad=it.filter(x=>x.status==="error"||x.status==="warn");
    let h=`<p class="headline">${bad.length?`${bad.length} Hinweis${bad.length>1?"e":""} gefunden`:"Alles in Ordnung"}</p>
      <div class="sub">${bad.length?"Du kannst zurückgehen und es ändern oder trotzdem weitermachen. Im Testmodus wird nichts gesendet.":"Zähler und Speicher sind erreichbar."}</div>`;
    h+=(bad.length?bad:it.slice(0,6)).map(x=>`<div class="check"><span class="ic ${x.status}">${x.status==="ok"?"✓":x.status==="error"?"✕":"!"}</span><span><b>${esc(x.area)} · ${esc(x.item)}</b><br>${esc(x.text)}${x.hint?`<div class="sub">${esc(x.hint)}</div>`:""}</span></div>`).join("");
    return h;
  }
  const ev=(lastStatus&&lastStatus.events||[]).slice(0,6);
  return `<p class="headline">Testlauf läuft</p>
    <div class="sub">SOLASI rechnet jetzt mit deinen echten Werten, sendet aber nichts. Im Protokoll siehst du, was passieren würde. Wenn es passt, schaltest du in der Kopfzeile den Testmodus aus.</div>
    <div class="log" style="margin-top:12px">${ev.map(e=>`<div class="${e.level}"><span class="t">${e.ts}</span><span>${esc(e.msg)}</span></div>`).join("")||"<div>Noch keine Einträge.</div>"}</div>
    <div class="sub" style="margin-top:12px">Später kannst du noch den Überschuss für Wallbox oder Heizstab einrichten und Meldungen auf dein Handy aktivieren.</div>`;
}
async function wizSave(){
  const r=await fetch("api/config",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(cfg)});
  const j=await r.json();if(!j.ok)throw new Error(j.error);dirty=false;
}
function renderSetup(keepScroll){
  if(!cfg)return;
  advHidden=0;
  const st=wz.step,last=st===WSTEPS.length-1;
  const steps=WSTEPS.map((l,i)=>`<div class="${i<st?"done":i===st?"cur":""}"><i>${i<st?"✓":i+1}</i>${l}</div>`).join("")+
    `<div class="skip"><i>+</i>Überschuss (optional)</div><div class="skip"><i>+</i>Meldungen (optional)</div>`;
  const needs=(st===1&&!cfg.grid.entity)||(st===2&&!isConf(cfg.units[0]));
  $("#p-setup").innerHTML=`<div class="wz"><div class="vsteps" aria-label="Schritte">${steps}</div>
    <div class="card"><h2>Schritt ${st+1} von ${WSTEPS.length}</h2><div id="wzbody">${wizBody()}</div>
    <div class="wfoot"><span>${needs?"Bitte zuerst oben auswählen.":"Du kannst jederzeit zurückgehen."}</span>
      ${st>0?'<button type="button" class="sec2" id="wz_back">Zurück</button>':""}
      <button type="button" class="primary" id="wz_next" ${needs||wz.busy?"disabled":""}>${last?"Fertig":st===0?"Los geht’s":"Weiter"}</button></div></div></div>`;
  if(st===2||st===3)cfg.units.forEach((u,i)=>{setSensorList(i,[]);refreshDevice(i);refreshModeOptions(i);
    for(const k of ["num","dir","script"]){const e=document.getElementById(`f_units_${i}_${k}`);if(e)e.addEventListener("input",()=>later("dev"+i,()=>refreshDevice(i)));}
    const m=document.getElementById(`f_units_${i}_mode`);if(m)m.addEventListener("input",()=>later("mode"+i,()=>refreshModeOptions(i)));
    for(const k of ["num","dir","script"]){const e=document.getElementById(`f_units_${i}_${k}`);if(e)e.addEventListener("input",()=>{const nb=document.getElementById("wz_next");if(nb&&st===2)nb.disabled=!isConf(cfg.units[0]);});}});
}
document.addEventListener("change",e=>{if(e.target.id==="f_grid_entity"&&curPage==="setup")renderSetup();});
document.addEventListener("click",async e=>{
  const g=e.target.closest("#wz_grid button");
  if(g){set("grid.entity",g.dataset.id);renderSetup();return;}
  if(e.target.id==="wz_second"){wz.second=true;renderSetup();return;}
  if(e.target.id==="wz_back"){wz.step=Math.max(0,wz.step-1);wz.check=null;renderSetup();window.scrollTo(0,0);return;}
  if(e.target.id==="wz_next"){
    const last=wz.step===WSTEPS.length-1;
    if(last){
      firstRun=false;wizDismissed=true;wz={step:0,second:false,check:null,busy:false};
      document.body.classList.remove("first");showPage("status");toast("Einrichtung abgeschlossen");return;}
    wz.step++;wz.check=null;
    if(wz.step===4){
      renderSetup();
      try{await wizSave();wz.check=await (await fetch("api/selfcheck")).json();}catch(err){wz.check={items:[{area:"Speichern",item:"Einstellungen",status:"error",text:String(err.message||err),hint:""}]};}
      if(wz.step===4)renderSetup();return;}
    if(wz.step===5){
      cfg.enabled=true;cfg.dry_run=true;
      try{await wizSave();syncQuick();}catch(err){toast("Speichern fehlgeschlagen");}
    }
    renderSetup();window.scrollTo(0,0);
  }
});

const W=v=>v==null?"–":`${Math.round(v)} W`;
function battery(soc){
  const c=soc==null?"var(--muted)":soc>=50?"var(--ok)":soc>=20?"var(--warn)":"var(--bad)";
  const w=soc==null?0:Math.max(0,Math.min(100,soc))*0.50;
  return `<svg viewBox="0 0 62 34" aria-hidden="true"><rect x="1.5" y="3" width="52" height="28" rx="6" fill="none" stroke="var(--muted)" stroke-width="2"/>
    <rect x="55" y="12" width="5" height="10" rx="2" fill="var(--muted)"/><rect x="4" y="6" width="${w}" height="22" rx="3.5" fill="${c}"/></svg>`;
}
/*FLOW-BEGIN*/
/* Gemeinsame Zeichnungen für Oberfläche und Dashboard-Karte: Energiefluss, Verlauf, Überschrift.
   Quelle für beide Stellen. Nach Änderungen `python tools/sync_flow.py` ausführen, das kopiert
   diesen Block in solasi/app/static/index.html und solasi/app/card/solasi-card.js.
   Farben kommen aus Variablen, die jede Stelle selbst setzt:
   --sf-card --sf-tile --sf-fg --sf-muted --sf-line --sf-sun --sf-bat --sf-grid --sf-home --sf-ok --sf-warn --sf-bad */
const SF = (() => {
  const fmt = v => Math.round(v).toLocaleString("de-DE");
  const wl = v => (v == null || isNaN(v)) ? "–" : fmt(v) + " W";
  const TW = 150, TH = 76;
  const T = { sun: { x: 245, y: 12 }, bat: { x: 20, y: 152 }, grid: { x: 470, y: 152 }, home: { x: 245, y: 252 } };
  // Linien in Flussrichtung: Solar→Haus, Solar→Speicher, Speicher→Haus, Netz→Haus
  const L = {
    sh: { pts: [[320, 88], [320, 140], [320, 200], [320, 252]], col: "--sf-sun" },
    sb: { pts: [[245, 50], [140, 50], [95, 92], [95, 152]], col: "--sf-sun" },
    bh: { pts: [[95, 228], [95, 275], [150, 290], [245, 290]], col: "--sf-bat" },
    gh: { pts: [[545, 228], [545, 270], [490, 290], [395, 290]], col: "--sf-grid" }
  };
  const bez = (p, t) => { const u = 1 - t; return [0, 1].map(i => u * u * u * p[0][i] + 3 * u * u * t * p[1][i] + 3 * u * t * t * p[2][i] + t * t * t * p[3][i]); };
  const pd = p => `M${p[0][0]} ${p[0][1]}C${p[1][0]} ${p[1][1]} ${p[2][0]} ${p[2][1]} ${p[3][0]} ${p[3][1]}`;
  const reduced = () => typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const socCol = s => s == null || s < 0 ? "var(--sf-muted)" : s < 20 ? "var(--sf-bad)" : s < 45 ? "var(--sf-warn)" : "var(--sf-ok)";
  const CSS = `<style>
    .sf-l{font-size:12.5px;font-weight:700;letter-spacing:.08em;fill:var(--sf-muted);text-transform:uppercase}
    .sf-v{font-size:22px;font-weight:800;fill:var(--sf-fg)}
    .sf-s{font-size:12.5px;font-weight:500;fill:var(--sf-muted)}
    .sf-c{font-size:12.5px;font-weight:700;fill:var(--sf-fg)}
    .sf-a{font-size:13px;fill:var(--sf-muted)}
    .sf-g{stroke:var(--sf-line);stroke-width:1;fill:none}
    .sf-i{fill:none;stroke:var(--sf-line);stroke-width:2.5;stroke-linecap:round}
    .sf-o{fill:none;stroke-linecap:round}
    svg text{font-family:inherit}</style>`;

  const ICON = {
    sun: c => `<g fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"><circle cx="16" cy="16" r="5.5"/><path d="M16 3v3.5M16 25.5V29M3 16h3.5M25.5 16H29M6.8 6.8l2.5 2.5M22.7 22.7l2.5 2.5M25.2 6.8l-2.5 2.5M9.3 22.7l-2.5 2.5"/></g>`,
    home: c => `<g fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M4 15.5 16 5l12 10.5"/><path d="M7 13.5V27h18V13.5"/><path d="M13.5 27v-7h5v7"/></g>`,
    grid: c => `<g fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M16 3v26M9 29l7-17 7 17M10.5 12h11M12.5 19.5h7"/></g>`,
    bat: (c, soc) => {
      const w = soc == null || soc < 0 ? 0 : Math.max(0, Math.min(100, soc)) / 100 * 17;
      return `<g fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round"><rect x="3" y="9" width="23" height="14" rx="3.5"/><path d="M28.5 13.5v5" stroke-linecap="round"/></g>` +
        (w ? `<rect x="6" y="12" width="${w.toFixed(1)}" height="8" rx="1.8" style="fill:${socCol(soc)}"/>` : "");
    }
  };

  function tile(k, label, val, sub, col, icon) {
    const t = T[k];
    return `<g><rect x="${t.x}" y="${t.y}" width="${TW}" height="${TH}" rx="18" style="fill:var(--sf-card)"/>
      <rect x="${t.x}" y="${t.y}" width="${TW}" height="${TH}" rx="18" style="fill:var(${col});fill-opacity:.13;stroke:var(${col});stroke-width:1.6"/>
      <g transform="translate(${t.x + 14} ${t.y + 14})">${icon}</g>
      <text x="${t.x + 54}" y="${t.y + 27}" class="sf-l">${label}</text>
      <text x="${t.x + 54}" y="${t.y + 50}" class="sf-v">${val}</text>
      ${sub ? `<text x="${t.x + 54}" y="${t.y + 66}" class="sf-s">${sub}</text>` : ""}</g>`;
  }

  /* d: {pv, house, bat (+ entlädt), grid (+ Bezug), soc, f:{sh, sb, bh, gh}} */
  function flow(d) {
    const f = d.f || {}, v = { sh: f.sh, sb: f.sb, bh: f.bh, gh: f.gh };
    let idle = "", live = "", dots = "", chips = "";
    for (const k in L) {
      const x = L[k], val = v[k] == null ? 0 : v[k];
      idle += `<path d="${pd(x.pts)}" class="sf-i"/>`;
      if (Math.abs(val) < 5) continue;
      const pts = val >= 0 ? x.pts : [...x.pts].reverse();
      const a = Math.abs(val), w = Math.min(6.5, 2.6 + a / 450);
      live += `<path d="${pd(pts)}" class="sf-o" style="stroke:var(${x.col});stroke-opacity:.5;stroke-width:${w.toFixed(1)}"/>`;
      const dur = Math.max(1.6, Math.min(4, 4.2 - a / 450));
      for (let i = 0; i < 3; i++) {
        if (reduced()) {
          const [px, py] = bez(pts, .2 + i * .3);
          dots += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${(w / 2 + 1.6).toFixed(1)}" style="fill:var(${x.col})"/>`;
        } else {
          dots += `<circle r="${(w / 2 + 1.8).toFixed(1)}" style="fill:var(${x.col})"><animateMotion dur="${dur.toFixed(2)}s" begin="${(-i * dur / 3).toFixed(2)}s" repeatCount="indefinite" path="${pd(pts)}"/></circle>`;
        }
      }
      const [mx, my] = bez(x.pts, .5), txt = fmt(a) + " W", cw = txt.length * 7.8 + 16;
      chips += `<rect x="${(mx - cw / 2).toFixed(1)}" y="${(my - 11).toFixed(1)}" width="${cw.toFixed(1)}" height="22" rx="11" style="fill:var(--sf-card);stroke:var(${x.col});stroke-opacity:.55"/>
        <text x="${mx.toFixed(1)}" y="${(my + 4).toFixed(1)}" text-anchor="middle" class="sf-c">${txt}</text>`;
    }
    const bat = d.bat, grid = d.grid == null ? 0 : d.grid, soc = d.soc != null && d.soc >= 0 ? Math.round(d.soc) : null;
    const batSub = bat == null ? "" : bat >= 5 ? "gibt ab" : bat <= -5 ? "lädt" : "ruht";
    const gridSub = grid >= 5 ? "Bezug" : grid <= -5 ? "Einspeisung" : "ausgeglichen";
    return `<svg viewBox="0 0 640 340" role="img" aria-label="Energiefluss">${CSS}${idle}${live}${dots}${chips}
      ${tile("sun", "Solar", wl(d.pv), d.pv != null && d.pv < 5 ? "keine Sonne" : "", "--sf-sun", ICON.sun("var(--sf-sun)"))}
      ${tile("bat", "Speicher", bat == null ? "–" : wl(Math.abs(bat)), batSub ? batSub + (soc != null ? " · " + soc + " %" : "") : (soc != null ? soc + " %" : ""), "--sf-bat", ICON.bat("var(--sf-bat)", soc))}
      ${tile("grid", "Netz", wl(Math.abs(grid)), gridSub, "--sf-grid", ICON.grid("var(--sf-grid)"))}
      ${tile("home", "Haus", wl(d.house), d.house != null ? "Verbrauch" : "", "--sf-home", ICON.home("var(--sf-home)"))}

  /* Überschrift aus den Flüssen; ohne Flüsse aus dem Sollwert. d: {f, grid, soc, target} */
  function headline(d) {
    const f = d.f, s = d.soc != null && d.soc >= 0 ? ` · mittlerer Ladestand ${Math.round(d.soc)} %` : "";
    const g = d.grid == null ? 0 : d.grid;
    const gs = Math.abs(g) < 30 ? "Netzbezug nahe null" : g > 0 ? `Netzbezug ${fmt(g)} W` : `Einspeisung ${fmt(-g)} W`;
    if (f) {
      const sh = f.sh >= 5, sb = f.sb >= 5, bh = f.bh >= 5, gh = f.gh >= 5;
      if (sh && sb) return ["Solar versorgt dein Haus und lädt den Speicher", gs + s];
      if (sh && bh && gh) return ["Solar, Speicher und Netz versorgen dein Haus", `Der Verbrauch ist höher als die Abgabe der Speicher${s}`];
      if (sh && bh) return ["Solar und Speicher versorgen dein Haus", gs + s];
      if (bh) return [`Der Speicher versorgt dein Haus mit ${fmt(f.bh)} W`, gs + s];
      if (sb) return [`Überschuss lädt den Speicher mit ${fmt(f.sb)} W`, (Math.abs(g) < 30 ? "Einspeisung wird vermieden" : gs) + s];
      if (sh && !gh) return ["Solar versorgt dein Haus", gs + s];
    }

    if (t > 0) return [`Die Speicher versorgen dein Haus mit ${fmt(t)} W`, `Netzbezug wird auf nahe null geregelt${s}`];

  /* Glatte Kurve durch die Punkte (Catmull-Rom als Bézier), Werte ohne Überschwingen unter 0 */
  function smooth(P, floorY) {
    if (P.length < 2) return "";

      const p0 = P[i - 1] || P[i], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2] || p2;
      const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = Math.min(floorY, p1[1] + (p2[1] - p0[1]) / 6);
      const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = Math.min(floorY, p2[1] - (p3[1] - p1[1]) / 6);
      s += `C${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;

  function trend(d) {

    const ts = d.t && d.t.length === n ? d.t : Array.from({ length: n }, (_, i) => end - (n - 1 - i) * 300);
    const t1 = Math.max(ts[n - 1], ts[0] + 600), t0 = Math.max(ts[0], t1 - 86400);

function patchEl(el,html){
  if(!el||el._html===html)return false;
  const r=el.getBoundingClientRect(),h0=el.offsetHeight;
  const open=[...el.querySelectorAll("details")].map(d=>d.open);
  el.innerHTML=html;el._html=html;
  el.querySelectorAll("details").forEach((d,i)=>{if(open[i])d.open=true});
  const dh=el.offsetHeight-h0;
  if(dh&&r.bottom<=0)window.scrollBy(0,dh);
  return true;
}

function layoutBlocks(root,B,order,weights){
  const shown=order.filter(id=>B[id]);
  const segs=[];let cur=null;
  shown.forEach(id=>{
    if(id==="kpis"){cur=null;segs.push({full:id});}
    else{if(!cur){cur={ids:[]};segs.push(cur);}cur.ids.push(id);}});
  segs.forEach(sg=>{
    if(!sg.ids)return;
    const tot=sg.ids.reduce((a,i)=>a+(weights[i]||2),0),target=tot*0.6;
    let acc=0;sg.left=[];sg.right=[];
    sg.ids.forEach(i=>{const w=weights[i]||2;((acc+w/2)<=target?sg.left:sg.right).push(i);acc+=w;});
    if(!sg.left.length&&sg.right.length){sg.left=sg.right;sg.right=[];}});
  const sig=JSON.stringify(segs);
  const blk=id=>`<div data-blk="${id}"></div>`;
  if(root._sig!==sig){
    root._sig=sig;root._html=null;
    root.innerHTML=`<div data-blk="banners"></div>`+segs.map(sg=>sg.full?blk(sg.full):
      `<div class="cols${sg.right.length?"":" one"}"><div class="stack">${sg.left.map(blk).join("")}</div>${sg.right.length?`<div class="stack">${sg.right.map(blk).join("")}</div>`:""}</div>`).join("");}

    return;}
  let banners="";
  if(s.safety&&s.safety.state==="stopped")banners+=`<div class="banner bad">⛔ <span><b>SOLASI ist gestoppt</b> (${esc(s.safety.reason)}${s.safety.since?`, seit ${esc(s.safety.since)}`:""}). Die Speicher wurden an ihren eigenen Modus zurückgegeben und werden nicht mehr gesteuert.
    <button class="primary" style="margin-left:10px" onclick="killOrResume()">Fortsetzen</button></span></div>`;
  if(!s.connected)banners+=`<div class="banner bad">🔌 Keine Verbindung zu Home Assistant.</div>`;
  if(!s.enabled)banners+=`<div class="banner off">⏸️ Die Regelung ist <b>aus</b>. SOLASI beobachtet nur und sendet nichts.</div>`;
  else if(s.dry_run)banners+=`<div class="banner test">🧪 <span><b>Testmodus:</b> SOLASI rechnet nur, gesendet wird nichts. Das Protokoll zeigt, was passieren würde.</span></div>`;
  if(s.enabled&&s.meter_ok===false)banners+=`<div class="banner bad">⚠️ <span><b>Der Zähler liefert keinen Wert.</b> Zur Sicherheit stehen die Speicher auf 0 W, bis er zurück ist. Prüfe in Home Assistant, ob der Zähler-Sensor verfügbar ist.
    <button class="primary" style="margin-left:10px" onclick="showPage('selftest')">Selbsttest öffnen</button></span></div>`;
  if(!s.units){rawStatus(banners+`<div class="card">Noch keine Daten. Bitte Zähler und Speicher einrichten und speichern.</div>`);return;}
  const [hl,sub]=headline(s);
  const mv=s.meter_view,mh=mv?SF.meters({items:mv.items,today:mv.today,show_day:mv.show_day,extra:mv.extra}):"";
  const B={banners};
  B.kpis=kpiHtml(s);
  B.meters=mh?`<div class="card"><h2>Heute und Zähler <a onclick="showPage('meters')">Verwalten</a></h2>${mh}</div>`:"";
  B.hero=`<div class="hero" style="margin:0"><div class="headline">${esc(hl)}</div><div class="sub">${esc(sub)}</div>
    <div class="flow">${flowSVG(s)}</div>
    <div>${s.eco_active?'<span class="tag warn">🌙 Eco-Modus aktiv</span>':''}${s.blocked_w?`<span class="tag">Entladung gesperrt für ${s.blocked_w} W</span>`:''}<span class="tag ${s.meter_ok?"ok":"bad"}">Zähler ${s.meter_ok?"in Ordnung":"Ausfall"}</span>
    <span class="tag">Gesamtsollwert ${s.t_target} W</span>
    ${s.curtail&&s.curtail.state==="ok"?'<span class="tag ok">Abregelung bestätigt</span>':''}
    ${s.curtail&&s.curtail.state==="fehlgeschlagen"?'<span class="tag bad">Abregelung greift nicht</span>':''}
    ${s.eco_active&&s.learned_base_load?`<span class="tag">Grundlast gelernt: ${s.learned_base_load} W</span>`:''}</div></div>`;
  B.trend=`<div class="card trendbox"><h2>Verlauf · letzte 24 Stunden <a onclick="showPage('stats')">Statistik</a></h2>${SF.trend(s.trend||{})||'<div class="empty">Der Verlauf füllt sich in den nächsten Minuten.</div>'}</div>`;
  let un=`<div class="card"><h2>Speicher <a onclick="showPage('units')">Verwalten</a></h2>`;
  const modeTxt=m=>({third_party_control:"Extern gesteuert",self_consumption:"Eigenverbrauch"})[m]||m||"–";
  const dirTxt=d=>({discharge:"gibt ab",charge:"lädt",idle:"ruht",standby:"ruht"})[String(d||"").toLowerCase()]||d||"–";
  s.units.forEach(u=>{
    const soc=u.soc<0?null:u.soc;
    un+=`<div class="urow"><div class="bat">${battery(soc)}</div><b>${esc(u.name)}</b><span class="w">${u.real} W</span>
      <span class="sub">${soc==null?"":soc+" % geladen · "}${esc(dirTxt(u.dir))} ${u.real} W${u.pv!=null?` · Solar ${u.pv} W`:""}</span>
      <span class="pills2">${u.available?'<span class="tag ok">bereit</span>':'<span class="tag warn">Leistung nicht verfügbar</span>'}${s.dry_run?'<span class="tag test">Test</span>':''}${u.force?'<span class="tag test">Abregelung (voll)</span>':''}<span class="tag">${esc(modeTxt(u.mode))}</span></span>
      <details class="udet"><summary>Technische Details</summary><dl><dt>Eingestellt</dt><dd>${u.set} W</dd><dt>Neu</dt><dd>${u.plan} W</dd><dt>Richtung</dt><dd>${esc(u.dir||"–")}</dd><dt>Modus</dt><dd>${esc(u.mode||"–")}</dd></dl></details></div>`;});
  B.units=un+`</div>`;
  B.surplus="";
  if(s.surplus_enabled){
    let sp=`<div class="card"><h2>Überschuss${s.surplus_dry_run?" · Test":""} <a onclick="showPage('surplus')">Verwalten</a></h2>
      <div class="sub" style="margin-bottom:4px">${W(s.surplus_w)} frei für Verbraucher</div>`;
    (s.slots||[]).forEach(sl=>{
      sp+=`<div class="cons"><b>${esc(sl.name)}</b>${sl.state?`<span class="tag ${sl.state==="on"?"ok":""}">${esc(sl.state)}</span>`:""}<span class="sub">${sl.num_v!=null?`Vorgabe ${sl.num_v} · `:""}${sl.own_w} W</span></div>`;});
    B.surplus=sp+`</div>`;}
  const mrow=e=>`<div class="${e.level}"><i></i><span class="t">${e.ts}</span><span class="m">${esc(e.msg)}</span></div>`;
  B.log=`<div class="card"><h2>Protokoll <a onclick="showPage('log')">Alle</a></h2><div class="mini" id="minilog">${(s.events||[]).slice(0,6).map(mrow).join("")||"<div>Noch keine Einträge.</div>"}</div></div>`;
  layoutBlocks($("#p-status"),B,uiBlocks("status",STATUS_BLOCKS).visible,{meters:2,hero:5,trend:3,units:1+(s.units||[]).length,surplus:s.surplus_enabled?1+(s.slots||[]).length*.5:0,log:2});
  renderLog(s.events);
}
function renderLog(ev){
  const row=e=>`<div class="${e.level}"><span class="t">${e.ts}</span><span>${esc(e.msg)}</span></div>`;
  patchEl($("#log"),(ev||[]).map(row).join("")||"<div>Noch keine Einträge.</div>");
}
async function poll(){
  try{const s=await (await fetch("api/status")).json();if(scrolling()){lastStatus=s;return;}renderStatus(s);renderLog(s.events);}
  catch(e){$("#connpill").className="pill";$("#conntext").textContent="Getrennt";}
}
loadAll().then(()=>{
  const sp=lookGet("start","status");if(sp!=="status"&&cfg&&cfg.grid.entity)showPage(sp);
  poll();setInterval(poll,2000);});
</script>
</body>
</html>
