    ${fz?(fz.warn?` <b style="color:var(--bad)">⚠ ${fz.phase} ist mit ${fz.a} A zu ${fz.pct} % ausgelastet.</b>`:` Höchste Auslastung: ${fz.phase} mit ${fz.pct} %.`):(v.fuse_a?"":" Die Balken gehen von 16-A-Sicherungen aus – trage unten deine Sicherung ein, dann stimmen sie und du bekommst eine Warnung.")}</div></div>
  <div class="card" style="margin-bottom:12px"><h2 style="margin:0 0 6px">Einspeise-Phase je Speicher</h2>${rows}
    <div style="margin-top:8px"><button type="button" class="ghost" id="ph_reset">Neu messen</button></div>
    <div class="sub" style="margin-top:8px">So funktioniert es: Ändert ein Speicher seine Ausgangsleistung, sinkt auf der Phase, in die er einspeist, der Netzbezug um genau diesen Betrag. SOLASI wertet die Sprünge aller Speicher gemeinsam aus, deshalb findet es auch heraus, wenn sie auf verschiedenen Phasen einspeisen. Ohne etwas zu schalten – es braucht nur ein paar Leistungsänderungen im normalen Betrieb. Ein manuell gesetzter Wert geht vor.</div></div>`;
}
document.addEventListener("change",e=>{
  const t=e.target;if(!t.closest||!t.closest("#p-phases"))return;const pc=phCfg();
  if(t.id==="ph_on"){pc.enabled=t.checked;markDirty();renderPhases();return;}
  if(t.dataset.ph){const [p,k]=t.dataset.ph.split(".");pc.sensors[p][k]=t.value;markDirty();return;}
  if(t.id==="ph_inv"){pc.invert=t.checked;markDirty();return;}
  if(t.id==="ph_fuse"){pc.fuse_a=+t.value||0;markDirty();return;}
  if(t.id==="ph_warn"){pc.warn_pct=+t.value||90;markDirty();return;}
  if(t.dataset.phfeed){pc.feed=(pc.feed&&typeof pc.feed==="object")?pc.feed:{};if(t.value)pc.feed[t.dataset.phfeed]=t.value;else delete pc.feed[t.dataset.phfeed];markDirty();return;}
});
document.addEventListener("click",async e=>{
  if(e.target.closest("#ph_guess")){const pc=phCfg();(phSensors||[]).forEach(x=>{if(x.phase&&!pc.sensors[x.phase][x.kind])pc.sensors[x.phase][x.kind]=x.entity;});markDirty();renderPhases();return;}
  if(e.target.closest("#ph_reset")){try{await fetch("api/phases/reset",{method:"POST"});}catch(x){}}
});
async function openPhases(){
  renderPhases();
  try{phSensors=(await (await fetch("api/phases/discover")).json()).sensors||[];}catch(e){phSensors=[];}
  if(curPage==="phases")renderPhases();
}


// ---- Laden aus dem Netz ----
const chgF={target:80,power_w:0,units:[],order:"",hours:12,nodis:true,hold:"none",holdAt:"08:00",init:false};
let chgEst=null,chgTimer=null,chgBusy="";
const CHG_ORD={low:"Niedrigster Ladestand zuerst",high:"Höchster Ladestand zuerst",list:"Wie in der Speicherliste",parallel:"Alle gleichzeitig"};
function chgCfg(){cfg.charge=Object.assign({order:"low",max_w:0},cfg.charge||{});return cfg.charge;}
function chgBody(){return {target:chgF.target,power_w:chgF.power_w,units:chgF.units,order:chgF.order,hours:chgF.hours,nodis:chgF.nodis,hold:{mode:chgF.hold,at:chgF.holdAt}};}
function renderCharge(){
  const el=$("#p-charge");if(!el)return;const cc=chgCfg(),us=(cfg.units||[]).filter(u=>u.name);
  const opts=o=>Object.entries(CHG_ORD).map(([k,l])=>`<option value="${k}"${k===o?" selected":""}>${l}</option>`).join("");
  el.innerHTML=`<div id="chg_live"></div>
  <div class="card" id="chg_form" style="margin-bottom:12px"><h2 style="margin:0 0 6px">Jetzt laden</h2>
    <div class="sub">Lädt die Speicher bis zum Ziel – auch aus dem Netz, wenn die Sonne nicht reicht (z. B. für ein Update, das 20 % braucht, oder für morgen früh). Am Ziel hört SOLASI von selbst auf und stellt alles zurück. Der Strom kostet; im Testmodus werden die Befehle nur protokolliert.</div>
    <div class="phrow" style="margin-top:10px"><label>Ziel (%)<input type="number" id="chg_target" min="1" max="100" value="${chgF.target}" style="width:90px"></label>
    <label>Leistung gesamt (W, 0 = so viel wie möglich)<input type="number" id="chg_power" min="0" step="100" value="${chgF.power_w}" style="width:110px"></label>
    <label>Spätestens nach<select id="chg_hours">${[1,2,4,8,12,24].map(h=>`<option value="${h}"${h===+chgF.hours?" selected":""}>${h} h</option>`).join("")}</select></label></div>
    <div style="margin-top:8px"><b>Speicher</b> <span class="wd">${us.map(u=>`<label><input type="checkbox" data-chgunit="${esc(u.name)}"${!chgF.units.length||chgF.units.includes(u.name)?" checked":""}>${esc(u.name)}</label>`).join(" ")}</span></div>
    <div style="margin-top:8px"><label>Reihenfolge <select id="chg_order"><option value="">Standard (${CHG_ORD[cc.order]||""})</option>${opts(chgF.order)}</select></label></div>
    <div style="margin-top:8px"><label class="tg"><input type="checkbox" id="chg_nodis"${chgF.nodis?" checked":""}><i></i>Währenddessen nicht aus den Speichern entladen</label></div>
    <div style="margin-top:8px"><label>Danach <select id="chg_hold"><option value="none"${chgF.hold==="none"?" selected":""}>normal weiterarbeiten</option><option value="until"${chgF.hold==="until"?" selected":""}>Entladen sperren bis Uhrzeit</option><option value="manual"${chgF.hold==="manual"?" selected":""}>Entladen sperren, bis ich freigebe</option></select></label>
      <input type="time" id="chg_holdat" value="${esc(chgF.holdAt)}" style="${chgF.hold==="until"?"":"display:none"}"></div>
    <div class="sub" id="chg_est" style="margin-top:10px">–</div>
    <div style="margin-top:10px"><button type="button" class="primary" id="chg_go">🔌 Laden starten</button> <span class="sub" id="chg_err" style="color:var(--bad)"></span></div></div>
  <div class="card" id="chg_locks" style="margin-bottom:12px"></div>
  <div class="card" style="margin-bottom:12px"><h2 style="margin:0 0 6px">Standard</h2>
    <div class="sub">Gilt für jedes Netz-Laden, auch aus der Automatik. Die Ladeleistung je Speicher ist die „max. Laden“ des Speichers.</div>
    <div class="phrow" style="margin-top:8px"><label>Reihenfolge<select id="chg_dorder">${opts(cc.order)}</select></label>
    <label>Höchstleistung gesamt (W, 0 = nur Speichergrenzen)<input type="number" id="chg_dmax" min="0" step="100" value="${cc.max_w||0}" style="width:110px"></label></div>
    <div class="sub" style="margin-top:8px">Hast du die Phasen mit Sicherung eingerichtet, begrenzt SOLASI die Ladeleistung außerdem so, dass die Einspeise-Phase des Speichers nicht überlastet wird.</div></div>`;
  renderChargeLive();chgEstimate();
}
function renderChargeLive(){
  const box=$("#chg_live");if(!box)return;const c=lastStatus&&lastStatus.charge,form=$("#chg_form");
  if(form)form.style.display=c&&c.active?"none":"";
  let h="";
  if(c&&c.active&&c.job){const j=c.job,e=c.estimate||{},al=c.alloc||{};
    const rows=(c.units||[]).map(u=>{const pct=Math.max(0,Math.min(100,u.soc));return `<div class="phfeed"><div><b>${esc(u.name)}</b><div>${u.soc<0?"–":Math.round(u.soc)} % von ${j.target} %${u.start!=null?` <span class="sub">(Start ${Math.round(u.start)} %)</span>`:""}${al[u.name]?` · lädt ${al[u.name]} W`:u.soc>=j.target?" · Ziel erreicht":""}</div></div><div class="hogbar" style="width:120px;height:7px"><i style="width:${pct}%"></i></div></div>`;}).join("");
    h=`<div class="card" style="margin-bottom:12px"><h2 style="margin:0 0 6px">🔌 Laden bis ${j.target} %</h2>${rows}
      <div class="sub" style="margin-top:8px">${e.kwh!=null?`Noch etwa ${e.kwh} kWh${e.hours!=null?` – ungefähr ${e.hours<1?Math.round(e.hours*60)+" Minuten":e.hours.toFixed(1).replace(".",",")+" Stunden"}`:""}.`:""} Gestartet ${esc(new Date(j.started*1000).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}))}${j.source?" ("+esc(j.source)+")":""}, endet spätestens nach ${j.hours} h.</div>
      <div style="margin-top:10px"><button type="button" class="ghost" id="chg_stop">Beenden</button></div></div>`;
  }else if(c&&c.last){const l=c.last;h=`<div class="card" style="margin-bottom:12px"><div class="sub">Zuletzt: ${esc(l.at)} – ${esc(l.why)}${l.kind==="done"?" ✅":l.kind==="stuck"||l.kind==="timeout"?" ⚠":""}</div></div>`;}
  box.innerHTML=h;renderLocks();
}
function renderLocks(){
  const el=$("#chg_locks");if(!el)return;const lk=(lastStatus&&lastStatus.locks)||{},us=(cfg.units||[]).filter(u=>u.name);
  const fmt=t=>new Date(t*1000).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
  const act=document.activeElement&&document.activeElement.id==="lk_until"?document.activeElement.value:null;
  el.innerHTML=`<h2 style="margin:0 0 6px">Entladesperre</h2>
    <div class="sub">Gesperrt gibt ein Speicher nichts aus der Batterie ab – nur was seine Module gerade liefern, geht weiter ins Haus. So bleibt die Ladung zum Beispiel für morgen früh erhalten. Laden ist weiterhin möglich.</div>
    ${us.map(u=>{const l=lk[u.name];return `<div class="phfeed"><div><b>${esc(u.name)}</b><div>${l?`🔒 gesperrt${l.until?" bis "+esc(fmt(l.until)):" bis zur Freigabe"}`:"gibt normal ab"}</div></div>
      ${l?`<button type="button" class="ghost" data-lk="${esc(u.name)}" data-on="0">Freigeben</button>`:`<span><input type="time" data-lkt="${esc(u.name)}" aria-label="Sperren bis Uhrzeit (leer = bis zur Freigabe)" style="width:100px"> <button type="button" class="primary" data-lk="${esc(u.name)}" data-on="1">Sperren</button></span>`}</div>`;}).join("")||`<div class="sub">Keine Speicher eingerichtet.</div>`}`;
}
function chgEstimate(){
  clearTimeout(chgTimer);chgTimer=setTimeout(async()=>{
    const el=$("#chg_est");if(!el)return;
    try{const j=await (await fetch("api/charge/estimate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(chgBody())})).json();chgEst=j.estimate;}catch(e){chgEst=null;}
    const e=chgEst,el2=$("#chg_est");if(!el2)return;
    if(!e){el2.textContent="Noch keine Speicherdaten.";return;}
    if(e.kwh<=0){el2.textContent="Alle gewählten Speicher sind schon über dem Ziel.";return;}
    el2.innerHTML=`Fehlen etwa <b>${e.kwh} kWh</b>`+(e.hours!=null?`, bei ${e.power_w} W dauert das ungefähr <b>${e.hours<1?Math.round(e.hours*60)+" Minuten":e.hours.toFixed(1).replace(".",",")+" Stunden"}</b>`:"")+`.`;
  },250);
}
document.addEventListener("change",e=>{
  const t=e.target;if(!t.closest||!t.closest("#p-charge"))return;
  if(t.id==="chg_target"){chgF.target=Math.max(1,Math.min(100,+t.value||1));chgEstimate();return;}
  if(t.id==="chg_power"){chgF.power_w=Math.max(0,+t.value||0);chgEstimate();return;}
  if(t.id==="chg_hours"){chgF.hours=+t.value;return;}
  if(t.id==="chg_nodis"){chgF.nodis=t.checked;return;}
  if(t.id==="chg_hold"){chgF.hold=t.value;const ha=$("#chg_holdat");if(ha)ha.style.display=t.value==="until"?"":"none";return;}
  if(t.id==="chg_holdat"){chgF.holdAt=t.value||"08:00";return;}
  if(t.id==="chg_order"){chgF.order=t.value;chgEstimate();return;}
  if(t.dataset.chgunit){const all=(cfg.units||[]).filter(u=>u.name).map(u=>u.name),cur=new Set(chgF.units.length?chgF.units:all);t.checked?cur.add(t.dataset.chgunit):cur.delete(t.dataset.chgunit);chgF.units=cur.size===all.length?[]:[...cur];chgEstimate();return;}
  if(t.id==="chg_dorder"){chgCfg().order=t.value;markDirty();return;}
  if(t.id==="chg_dmax"){chgCfg().max_w=Math.max(0,+t.value||0);markDirty();return;}
});
document.addEventListener("click",async e=>{
  if(e.target.closest("#chg_go")){
    const err=$("#chg_err");err.textContent="";
    try{const r=await fetch("api/charge/start",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(chgBody())}),j=await r.json();
      if(!j.ok){err.textContent=j.error||"Konnte nicht starten";return;}
      lastStatus=Object.assign({},lastStatus||{},{charge:j});renderChargeLive();renderBadges(lastStatus);
    }catch(x){err.textContent="Keine Verbindung";}
    return;}
  const lkb=e.target.closest("[data-lk]");
  if(lkb){const name=lkb.dataset.lk,on=lkb.dataset.on==="1",ti=[...document.querySelectorAll("[data-lkt]")].find(x=>x.dataset.lkt===name);
    try{const j=await (await fetch("api/locks",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({unit:name,on,until:on&&ti?ti.value:""})})).json();
      if(j.ok){lastStatus=Object.assign({},lastStatus||{},{locks:j.locks});renderLocks();renderBadges(lastStatus);}}catch(x){}
    return;}
  if(e.target.closest("#chg_stop")){try{await fetch("api/charge/stop",{method:"POST"});}catch(x){}
    if(lastStatus&&lastStatus.charge){lastStatus.charge.active=false;lastStatus.charge.job=null;}renderChargeLive();if(lastStatus)renderBadges(lastStatus);}
});
function openCharge(){renderCharge();}

// ---- Konten & Rollen ----
let meInfo={name:"Home Assistant",role:"owner",direct:false},acctData=null;
async function loadMe(){
  try{const j=await (await fetch("api/me")).json();if(j&&j.role){meInfo=j;document.body.dataset.role=j.role;}}catch(e){}
}
async function loadAccounts(){
  const el=$("#p-accounts");
  if(meInfo.role!=="owner"){el.innerHTML=`<div class="card"><h2>Konten &amp; Zugang</h2><div class="sub">Du bist als <b>${esc(meInfo.name)}</b> angemeldet (${esc((meInfo.roles||{})[meInfo.role]||meInfo.role)}). Konten verwaltet nur ein Besitzer.</div><button type="button" class="ghost" id="logoutbtn" style="margin-top:10px">Abmelden</button></div>`;return;}
  try{const j=await (await fetch("api/accounts")).json();if(j&&Array.isArray(j.users)){acctData=j;}}catch(e){}
  renderAccounts();
}
function renderAccounts(){
  const el=$("#p-accounts"),users=(acctData&&acctData.users)||[],roles=(acctData&&acctData.roles)||{owner:"Besitzer",member:"Mitbewohner",viewer:"Nur lesen"};
  const ro=sel=>Object.entries(roles).map(([k,l])=>`<option value="${k}"${k===sel?" selected":""}>${l}</option>`).join("");
  el.innerHTML=`${users.length?"":`<div class="banner">🔓 <span><b>Eigener Port ist offen</b>, solange kein Konto existiert. Wenn du den Port in der Add-on-Konfiguration freigibst, kann jeder im Netzwerk SOLASI bedienen. Lege ein Konto an, um ihn zu schützen.</span></div>`}<div class="card" style="margin-bottom:12px"><h2 style="margin:0 0 6px">Konten &amp; Zugang</h2>
  <div class="sub"><b>Besitzer</b> darf alles. <b>Mitbewohner</b> darf Modus wechseln und den Not-Aus bedienen. <b>Nur lesen</b> darf alles ansehen. Über Home Assistant bist du automatisch angemeldet – Konten brauchst du nur für den eigenen Zugang ohne Home Assistant.</div></div>
  <div id="acctlist">${users.map(u=>`<div class="card" style="margin-bottom:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap" data-acct="${esc(u.name)}"><b style="flex:1;min-width:120px">👤 ${esc(u.name)}</b><select data-arole="${esc(u.name)}" aria-label="Rolle von ${esc(u.name)}">${ro(u.role)}</select><button type="button" class="ghost" data-apw="${esc(u.name)}">Passwort ändern</button><button type="button" class="ghost" data-adel="${esc(u.name)}" title="Konto löschen">✕</button></div>`).join("")||`<div class="sub" style="padding:6px 2px">Noch kein Konto. Lege zuerst ein Besitzer-Konto an – erst dann ist der eigene Zugang nutzbar.</div>`}</div>
  <div class="card" style="margin-top:12px"><h3 style="margin:0 0 8px">Neues Konto</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><input id="an_name" placeholder="Name" autocomplete="off" style="flex:1;min-width:120px"><input id="an_pw" type="password" placeholder="Passwort (mind. 8 Zeichen)" autocomplete="new-password" style="flex:1;min-width:160px"><select id="an_role">${ro(users.length?"member":"owner")}</select><button type="button" class="primary" id="an_add">Anlegen</button></div><div id="an_msg" class="sub" style="margin-top:6px"></div></div>
  <div class="card" style="margin-top:12px"><h3 style="margin:0 0 6px">Eigener Port</h3><div class="sub">Mit einem eigenen Port erreichst du SOLASI direkt, ohne den Umweg über Home Assistant: Öffne in Home Assistant <b>Einstellungen → Add-ons → SOLASI → Konfiguration → Netzwerk</b> und trage bei „8100/tcp“ einen Port ein (z. B. 8100). Danach: <code>http://&lt;Adresse-von-Home-Assistant&gt;:8100</code>. Leer lassen = aus. <b>Solange es kein Konto gibt, ist der Port offen</b> – jeder im Netzwerk darf alles bedienen (wie bei PrintDock). Sobald du das erste Konto anlegst, verlangt er eine Anmeldung. Nutze ihn nur im Heimnetz, nicht im Internet.</div></div>`;
}
async function acctCall(method,url,body){
  const r=await fetch(url,{method,headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  const j=await r.json();if(!j.ok)throw new Error(j.error||"Fehler");acctData={...acctData,users:j.users};renderAccounts();return j;}
document.addEventListener("click",async e=>{
  if(e.target.closest("#an_add")){const msg=$("#an_msg");
    try{await acctCall("POST","api/accounts",{create:true,name:$("#an_name").value,password:$("#an_pw").value,role:$("#an_role").value});toast("Konto angelegt");}catch(x){msg.textContent=x.message;}return;}
  const pw=e.target.closest("[data-apw]");if(pw){const n=prompt(`Neues Passwort für ${pw.dataset.apw} (mind. 8 Zeichen):`,"");if(!n)return;
    try{await acctCall("POST","api/accounts",{name:pw.dataset.apw,password:n});toast("Passwort geändert");}catch(x){toast(x.message);}return;}
  const dl=e.target.closest("[data-adel]");if(dl){if(!confirm(`Konto „${dl.dataset.adel}“ löschen?`))return;
    try{await acctCall("DELETE","api/accounts/"+encodeURIComponent(dl.dataset.adel));toast("Konto gelöscht");}catch(x){toast(x.message);}return;}
  if(e.target.closest("#logoutbtn")){await fetch("api/logout",{method:"POST"});location.reload();}
});
document.addEventListener("change",async e=>{
  const r=e.target.closest("[data-arole]");if(r){try{await acctCall("POST","api/accounts",{name:r.dataset.arole,role:r.value});toast("Rolle geändert");}catch(x){toast(x.message);loadAccounts();}}
});

</script>
