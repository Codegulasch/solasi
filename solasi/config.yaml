name: "SOLASI"
version: "2.3.1"
slug: solasi
description: "SOLASI – Nulleinspeisung und Energieregelung für Heimspeicher (Anker SOLIX, Marstek u. a.) mit Eco-Modus, Überschusssteuerung, Not-Aus und Live-Übersicht"
url: "https://github.com/DEIN-NAME/solasi"
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
ports:
  8100/tcp: null
ports_description:
  8100/tcp: "Direkter Zugang zu SOLASI mit Anmeldung (offen, bis ein Konto angelegt ist). Leer lassen = aus (nicht erreichbar); z. B. 8100 eintragen = im Heimnetz erreichbar unter http://<HA-Adresse>:8100"
panel_icon: mdi:solar-power
panel_title: "SOLASI"
homeassistant_api: true
services:
  - mqtt:want
map:
  - type: homeassistant_config
    read_only: false
